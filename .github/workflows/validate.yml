name: Validate Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Check C# files exist
      run: |
        echo "Validating source files..."
        test -f Plugins/TRTrackerPlugin/TRTrackerPlugin.cs || { echo "TRTrackerPlugin.cs missing!"; exit 1; }
        test -f Plugins/TRBarPlugin/TRBarPlugin.cs || { echo "TRBarPlugin.cs missing!"; exit 1; }
        test -f Plugins/TRBarrelsPlugin/TRBarrelsPlugin.cs || { echo "TRBarrelsPlugin.cs missing!"; exit 1; }
        test -f Plugins/TRStatsPlugin/TRStatsPlugin.cs || { echo "TRStatsPlugin.cs missing!"; exit 1; }
        test -f Plugins/TRStatsPlugin/Patches.cs || { echo "TRStats Patches.cs missing!"; exit 1; }
        test -f Plugins/TRAutoloaderPlugin/TRAutoloaderPlugin.cs || { echo "TRAutoloaderPlugin.cs missing!"; exit 1; }
        echo "✓ All source files present"

    - name: Verify source file versions
      run: |
        echo "Checking plugin versions..."
        grep -q 'BepInPlugin.*1\.3\.4' Plugins/TRTrackerPlugin/TRTrackerPlugin.cs && echo "✓ TRTrackerPlugin v1.3.4"
        grep -q 'BepInPlugin.*1\.3\.1' Plugins/TRBarPlugin/TRBarPlugin.cs && echo "✓ TRBarPlugin v1.3.1"
        grep -q 'BepInPlugin.*1\.3\.1' Plugins/TRBarrelsPlugin/TRBarrelsPlugin.cs && echo "✓ TRBarrelsPlugin v1.3.1"
        grep -q 'PLUGIN_VERSION = "1\.3\.0"' Plugins/TRStatsPlugin/TRStatsPlugin.cs && echo "✓ TRStatsPlugin v1.3.0"
        grep -q 'BepInPlugin.*1\.1\.4' Plugins/TRAutoloaderPlugin/TRAutoloaderPlugin.cs && echo "✓ TRAutoloaderPlugin v1.1.4"

    - name: Basic C# syntax validation
      run: |
        echo "Installing Roslyn for syntax checking..."
        dotnet tool install --global dotnet-format || true

        echo "Checking C# syntax..."
        for file in Plugins/*/*.cs; do
          echo "Validating $file..."
          # Basic check - file should contain namespace and class
          grep -q "namespace" "$file" || { echo "No namespace in $file"; exit 1; }
          grep -q "class" "$file" || { echo "No class definition in $file"; exit 1; }
        done
        echo "✓ Basic syntax validation passed"

    - name: Verify build artifacts
      run: |
        echo "Checking pre-built DLLs..."
        test -f build/TRTracker.dll || { echo "TRTracker.dll missing!"; exit 1; }
        test -f build/TRBar.dll || { echo "TRBar.dll missing!"; exit 1; }
        test -f build/TRBarrels.dll || { echo "TRBarrels.dll missing!"; exit 1; }
        test -f build/TRStats.dll || { echo "TRStats.dll missing!"; exit 1; }
        test -f build/TRAutoloader.dll || { echo "TRAutoloader.dll missing!"; exit 1; }
        echo "✓ All DLLs present"

        echo "DLL sizes:"
        ls -lh build/*.dll

