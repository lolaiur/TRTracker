name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.3.1)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Full history and tags, so the duplicate-tag check below can actually see existing tags.
        fetch-depth: 0

    - name: Validate version format
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format: $VERSION"
          echo "Expected format: X.Y.Z (e.g., 1.3.1)"
          exit 1
        fi
        echo "VERSION=v$VERSION" >> $GITHUB_ENV
        echo "VERSION_NUM=$VERSION" >> $GITHUB_ENV

    - name: Check if tag exists
      run: |
        if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
          echo "Tag v${{ github.event.inputs.version }} already exists!"
          exit 1
        fi

    - name: Verify DLLs exist
      run: |
        test -f build/TRTracker.dll || { echo "TRTracker.dll missing!"; exit 1; }
        test -f build/TRBar.dll || { echo "TRBar.dll missing!"; exit 1; }
        test -f build/TRBarrels.dll || { echo "TRBarrels.dll missing!"; exit 1; }
        test -f build/TRStats.dll || { echo "TRStats.dll missing!"; exit 1; }
        test -f build/TRAutoloader.dll || { echo "TRAutoloader.dll missing!"; exit 1; }
        echo "✓ All DLLs present"

    - name: Package release
      run: |
        mkdir -p release
        cp build/*.dll release/
        cd release
        zip -r ../TRTracker-${{ env.VERSION }}.zip *.dll
        cd ..

        echo "Package contents:"
        unzip -l TRTracker-${{ env.VERSION }}.zip

    - name: Build release notes
      run: |
        # Each plugin's version comes from its source, so these notes cannot drift from the DLLs.
        ver() {
          v=$(grep -oE 'BepInPlugin\("[^"]+", "[^"]+", "[0-9]+\.[0-9]+\.[0-9]+"\)' "$1" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -z "$v" ] && v=$(grep -oE 'PLUGIN_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' "$1" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "${v:-unknown}"
        }

        # This version's section of CHANGELOG.md; fall back to commit subjects since the last tag.
        CHANGES=$(awk -v ver="$VERSION_NUM" '$0 == "## " ver {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md | sed '/./,$!d')
        if [ -z "$CHANGES" ]; then
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            CHANGES=$(git log "${LATEST_TAG}..HEAD" --no-merges --pretty='- %s')
          else
            CHANGES="Initial release"
          fi
        fi

        {
          echo "## Traveler's Rest Tracker Mods $VERSION_NUM"
          echo ""
          echo "Five BepInEx plugins for Traveler's Rest. Each works on its own."
          echo ""
          echo "- **TRTracker** $(ver Plugins/TRTrackerPlugin/TRTrackerPlugin.cs) (F1): live tavern stats"
          echo "- **TRBarrels** $(ver Plugins/TRBarrelsPlugin/TRBarrelsPlugin.cs) (F2): aging barrel tracker"
          echo "- **TRBar** $(ver Plugins/TRBarPlugin/TRBarPlugin.cs) (F3): taps, stock, and flow rates"
          echo "- **TRStats** $(ver Plugins/TRStatsPlugin/TRStatsPlugin.cs) (F4): cheats and gameplay tweaks"
          echo "- **TRAutoloader** $(ver Plugins/TRAutoloaderPlugin/TRAutoloaderPlugin.cs) (F5): automatic food and drink loading"
          echo ""
          echo "### Installation"
          echo ""
          echo "1. Install BepInEx 5.4.23.4 x64 (see the README)."
          echo "2. Download \`TRTracker-$VERSION.zip\` and extract the DLL files."
          echo "3. Copy them to \`Travellers Rest/Windows/BepInEx/plugins/\`."
          echo "4. Launch the game."
          echo ""
          echo "### Changes"
          echo ""
          echo "$CHANGES"
          echo ""
          echo "---"
          echo ""
          echo "These DLLs are built from the source in this repository. Full history is in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
        } > release_notes.md

        cat release_notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: TRTracker ${{ env.VERSION }}
        body_path: release_notes.md
        files: TRTracker-${{ env.VERSION }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
